name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "37 8 * * 1,5"
env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Install nightly
      run: rustup toolchain install nightly && rustup toolchain install stable && rustup toolchain install 1.80
    - name: Miri (nightly)
      run: rustup component add --toolchain nightly miri && cargo +nightly miri test
    - name: Miri big-endian expected-bytes tests (nightly, s390x)
      run: rustup component add --toolchain nightly rust-src && cargo +nightly miri test -p savefile --test endian_expected --target s390x-unknown-linux-gnu
    - name: Build (nightly)
      run: cargo +nightly build --workspace 
    - name: Run tests (nightly)
      run: cargo +nightly test --workspace 
    - name: Build min-deps (nightly)
      run: cargo +nightly build -p savefile-min-build 
    - name: Build (stable)
      run: cargo +stable build --workspace 
    - name: Run tests (stable)
      run: cargo +stable test --workspace 
    - name: Build min-deps (stable)
      run: cargo +stable build -p savefile-min-build
    - name: compile_tests (stable)
      run: cd compile_tests && cargo +stable test
    - name: Build (1.82)
      run: cargo +1.82 build --workspace

